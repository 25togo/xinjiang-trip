# 推薦住宿（兩人房單晚 RMB 參考）
hotels:
  - city: 喀什
    name: 喀什老城蘇萊曼客棧 / 銀瑞林國際酒店
    price_rmb: 400-600
    note: 老城內民宿體驗、市區商旅選銀瑞林
  - city: 塔什庫爾干
    name: 帕米爾賓館 / 冰山賓館
    price_rmb: 350-500
    note: 含氧氣設備優先選；3 晚要訂同一家方便寄物
  - city: 葉城
    name: 葉城賓館
    price_rmb: 300-400
    note: 選擇少，連鎖商旅優先
  - city: 和田
    name: 和田賓館 / 維景國際
    price_rmb: 350-500
    note: 維景較新
  - city: 阿克蘇
    name: 阿克蘇大飯店
    price_rmb: 300-400
    note: 商務型即可
  - city: 庫車
    name: 庫車賓館 / 鴻泉假日
    price_rmb: 300-450
    note: 鴻泉新一點
  - city: 巴音布魯克
    name: 天鵝湖賓館 / 牧民氈房
    price_rmb: 400-800
    note: 氈房是體驗重點
  - city: 那拉提
    name: 那拉提山莊 / 牧民氈房
    price_rmb: 400-700
    note: 草原內氈房 vs 鎮上酒店二選一
  - city: 賽里木湖
    name: 賽湖明珠客棧 / 雪嶺雲杉景區帳篷酒店
    price_rmb: 500-800
    note: 湖邊住一晚是這趟亮點，可看湖景日出
  - city: 烏魯木齊
    name: 機場酒店（轉機過夜用）/ 麥田國際青年旅舍
    price_rmb: 350-500
    note: Day 15 晚班機，可不需訂房；若航班延誤備用

