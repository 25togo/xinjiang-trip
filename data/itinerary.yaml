trip:
  name: 2026 南疆 15 天深度遊
  start_date: "2026-08-16"
  end_date: "2026-08-30"
  travelers: 2
  route_type: 帕米爾盤龍古道＋克孜爾石窟＋獨庫南中段＋賽里木湖＋果子溝＋烏市深度（喀什進、烏魯木齊出 開口票）
  vehicle: 包車（單日 RMB 1100-1300）
  flight_in: "8/16 台北 17:55 → 上海 PVG 過夜轉 → 8/17 抵達喀什 21:40"
  flight_out: "8/30 烏魯木齊 09:05 → 上海轉機 → 台北 17:40"

days:
  - day: 1
    date: "2026-08-16"
    city_from: 台北
    city_to: 上海
    transport: 飛機（TPE 17:55→PVG 約 21:00）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海 PVG 機場轉機酒店
    cover_place_id: shanghai
    highlights:
      - 17:00 抵桃園機場 check-in
      - 17:55 起飛 → 21:00 抵上海浦東
      - 入住機場附近轉機酒店或機場過夜
    notes: 訂浦東機場 5 分鐘車程的轉機酒店（如 Aerotel Shanghai、上海浦東國際機場日航酒店），RMB 400-600。明早再回機場搭 PVG→KHG 班機。

  - day: 2
    date: "2026-08-17"
    city_from: 上海
    city_to: 喀什
    transport: 飛機（PVG→KHG 約 6h，多半單轉烏魯木齊）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 喀什
    cover_place_id: kashgar
    highlights:
      - 上午回上海浦東機場 check-in
      - PVG→KHG 班機（南航 CZ 多半下午起飛）
      - 21:40 抵達喀什機場
      - 包車師傅機場接機，入住酒店
    notes: 這天等於只能睡覺，21:40 落地後直接入住喀什酒店。明天上午先去公安局辦邊防證。

  - day: 3
    date: "2026-08-18"
    city_from: 喀什
    city_to: 喀什
    transport: 步行/包車市區（全日打包）
    altitude_m: 1289
    distance_km: 15
    drive_hours: 1
    overnight: 喀什
    cover_place_id: id_kah_mosque
    highlights:
      - 9:00 喀什公安局辦邊防證（含等待 2h）
      - 11:00 換 RMB＋啟用 eSIM
      - 12:00 午餐：Marhaba 餐廳或大巴扎美食街
      - 13:30 艾提尕爾清真寺
      - 14:30 喀什大巴扎
      - 16:00 香妃墓（阿帕克霍加麻札）
      - 18:00 喀什老城（高台民居、百年茶館）
      - 20:00 晚餐：百年老茶館或大巴扎美食街
    notes: 一天打包喀什所有重點。包車師傅可代辦邊防證省 1h。穿著遮肩膀及膝（進清真寺）。

  - day: 4
    date: "2026-08-19"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 295
    drive_hours: 7
    overnight: 塔什庫爾干
    cover_place_id: karakul_lake
    highlights:
      - 蓋孜檢查站（出示邊防證）
      - 白沙湖＋白沙山（停留拍照 30 分鐘）
      - 卡拉庫里湖（慕士塔格峰倒影，海拔 3600m）
      - 17:00 抵達塔縣，入住塔吉克民宿或冰山賓館
      - 18:00 石頭城（公主堡遺址）
      - 19:30 金草灘濕地日落
    notes: 上升 1800m，部分人會頭痛。準備紅景天、攜帶氧氣。傍晚石頭城+金草灘可看日落。

  - day: 5
    date: "2026-08-20"
    city_from: 塔什庫爾干
    city_to: 塔什庫爾干
    transport: 包車（314 國道塔瓦段）
    altitude_m: 4200
    distance_km: 200
    drive_hours: 6
    overnight: 塔什庫爾干
    cover_place_id: panlong
    highlights:
      - 塔縣→瓦恰鄉 盤龍古道（639 個 S 形彎道）
      - 盤龍古道網紅觀景台俯瞰整條公路盤旋如龍
      - 沿途帕米爾高原牧場、塔吉克族村莊
      - 海拔 3000-4200m 變化
      - 瓦恰鄉午餐後原路返塔縣
    notes: 盤龍古道 2019 年通車，是 314 國道塔縣到瓦恰段。沒護欄、髮夾彎多，包車師傅必須熟此段。海拔變化劇烈，車上備氧氣。下午 4 點前回塔縣以免天黑開山路。

  - day: 6
    date: "2026-08-21"
    city_from: 塔什庫爾干
    city_to: 葉城
    transport: 包車（原路返喀什再轉葉城）
    altitude_m: 1380
    distance_km: 500
    drive_hours: 9
    overnight: 葉城
    cover_place_id: yecheng
    highlights:
      - 下高原（沿 314 國道）
      - 中午回喀什吃午餐
      - 下午轉 219 國道往葉城
      - 葉城零公里紀念碑（新藏線起點）
    notes: 這天車程最長。下高原後身體會明顯舒服。葉城住宿選擇少，建議連鎖商旅。

  - day: 7
    date: "2026-08-22"
    city_from: 葉城
    city_to: 和田
    transport: 包車（315 國道，崑崙山北麓）
    altitude_m: 1380
    distance_km: 410
    drive_hours: 6
    overnight: 和田
    cover_place_id: yulong_river
    highlights:
      - 早 6:00 葉城出發
      - 沿崑崙山北麓行駛
      - 約 12:00 抵和田，午餐
      - 下午和田老城＋玉龍喀什河採玉
      - 艾德萊斯絲綢工坊
      - 晚上和田夜市（烤包子、馕坑肉、烤全羊）
    notes: 早出 6am 才有時間下午玩和田。和田玉真假難辨，不建議在路邊買大件。

  - day: 8
    date: "2026-08-23"
    city_from: 和田
    city_to: 阿克蘇
    transport: 包車（沙漠公路，217 國道）
    altitude_m: 1100
    distance_km: 550
    drive_hours: 8
    overnight: 阿克蘇
    cover_place_id: tarim_highway
    highlights:
      - 穿越塔克拉瑪干沙漠公路
      - 中途休息點停留拍照
      - 抵達阿克蘇晚餐
    notes: 沙漠公路全程加油站少，師傅會提前準備。8 月沙漠白天 40°C+。

  - day: 9
    date: "2026-08-24"
    city_from: 阿克蘇
    city_to: 庫車
    transport: 包車（連霍高速）
    altitude_m: 1100
    distance_km: 270
    drive_hours: 4
    overnight: 庫車
    cover_place_id: kizil_caves
    highlights:
      - 阿克蘇→庫車
      - 克孜爾石窟（古龜茲佛教遺址，中國最早佛教石窟）
      - 庫車老城＋庫車大寺
      - 庫車大馕＋庫車大巴扎晚餐
    notes: 克孜爾石窟比敦煌早 200 年，要排隊買票。

  - day: 10
    date: "2026-08-25"
    city_from: 庫車
    city_to: 巴音布魯克
    transport: 包車（獨庫公路南段）
    altitude_m: 2400
    distance_km: 350
    drive_hours: 7
    overnight: 巴音布魯克
    cover_place_id: bayanbulak
    highlights:
      - 獨庫公路 217 國道南段（最精華段）
      - 鐵力買提達坂（雪山公路）
      - 大龍池/小龍池（高山湖泊）
      - 巴音布魯克草原（天鵝湖）
      - 九曲十八彎日落（必看）
    notes: 獨庫公路 6-10 月通車。日落是巴音布魯克招牌，預留 17:00 後抵達觀景台。

  - day: 11
    date: "2026-08-26"
    city_from: 巴音布魯克
    city_to: 那拉提
    transport: 包車（獨庫公路中段）
    altitude_m: 1800
    distance_km: 160
    drive_hours: 4
    overnight: 那拉提
    cover_place_id: narati
    highlights:
      - 早上巴音布魯克→那拉提（獨庫中段）
      - 那拉提空中草原（半日玩）
      - 哈薩克牧民氈房體驗
      - 騎馬（可選）
      - 晚上住那拉提山莊或鎮上酒店
    notes: 輕鬆一天。那拉提分空中草原和河谷草原，建議空中草原。

  - day: 12
    date: "2026-08-27"
    city_from: 那拉提
    city_to: 賽里木湖
    transport: 包車（G218 伊犁河谷）
    altitude_m: 2073
    distance_km: 420
    drive_hours: 6
    overnight: 賽里木湖（湖邊客棧）
    cover_place_id: sayram_lake
    highlights:
      - 早上那拉提空中草原最後遊覽
      - 那拉提→伊寧（伊犁河谷）
      - 中午伊寧休息＋午餐
      - 伊寧→賽里木湖
      - 入住賽里木湖邊客棧
      - 黃昏環湖看日落
    notes: 一日 5-6h 駕車，輕鬆。賽里木湖邊客棧 RMB 500-800/晚，這趟最貴住宿但體驗值得。

  - day: 13
    date: "2026-08-28"
    city_from: 賽里木湖
    city_to: 烏魯木齊
    transport: 包車（G30 連霍高速）
    altitude_m: 800
    distance_km: 530
    drive_hours: 7
    overnight: 烏魯木齊市區
    cover_place_id: guozigou
    highlights:
      - 早 7:00 賽里木湖日出
      - 賽里木湖環湖
      - 賽里木湖→果子溝大橋（最美高速公路橋）
      - 沿 G30 連霍高速→烏蘇→烏魯木齊
      - 17:00 抵烏市市區，入住
      - 晚餐建議：紅旗路五一夜市（新疆風味集大成）
    notes: 抵達烏市先住市區，明天再玩烏市深度。果子溝大橋會經過，車上拍照（高速不能停）。

  - day: 14
    date: "2026-08-29"
    city_from: 烏魯木齊
    city_to: 烏魯木齊
    transport: 步行/包車市區
    altitude_m: 800
    distance_km: 20
    drive_hours: 1
    overnight: 烏魯木齊機場附近酒店
    cover_place_id: xinjiang_museum
    highlights:
      - 上午新疆博物館（國家一級館，西域古國文物超多，必看樓蘭美女、五星出東方）
      - 中午午餐：博物館附近塔吉克餐廳
      - 下午紅山公園（烏市標誌，鎮城之寶）
      - 黃昏烏魯木齊國際大巴扎深度（伴手禮採買）
      - 晚餐大巴扎美食街
      - 21:00 transfer 機場附近酒店（明早 06:30 check-in）
    notes: 烏市深度文化日。新疆博物館 9:30 開門，建議 9:00 排隊。週一閉館！如遇週一就只能去大巴扎。紅山公園是烏市制高點看夜景。

  - day: 15
    date: "2026-08-30"
    city_from: 烏魯木齊
    city_to: 台北
    transport: 飛機（URC 09:05→上海轉→TPE 17:40）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: urumqi_bazaar
    highlights:
      - 06:30 抵達烏魯木齊地窩堡機場 check-in
      - 09:05 起飛
      - 經上海轉機
      - 17:40 抵達桃園機場
    notes: 早班機。建議 Day 14 晚一定睡早，05:30 起床。
