trip:
  name: 2026 南疆 15 天深度遊
  start_date: "2026-08-16"
  end_date: "2026-08-30"
  travelers: 2
  route_type: 帕米爾盤龍古道＋塔莎古道＋獨庫南中段＋伊犁河谷六星街＋賽里木湖＋果子溝（喀什進、烏魯木齊出 開口票）
  vehicle: 包車（單日 RMB 1100-1300）
  flight_in: "東方航空 MU｜8/16 台北 15:30 → 上海 PVG 17:30（住浦東亞朶酒店）｜8/17 PVG 07:05 → KHG 13:50（直飛 6h45m）"
  flight_out: "8/30 烏魯木齊 09:05 → 上海轉機 → 台北 17:40"

days:
  - day: 1
    date: "2026-08-16"
    city_from: 台北
    city_to: 上海
    transport: 東方航空 MU（TPE 15:30→PVG 17:30，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海浦東亞朶酒店
    cover_place_id: shanghai
    highlights:
      - 13:30 抵桃園機場 check-in
      - 15:30 起飛 → 17:30 抵上海浦東 T1
      - 入住浦東亞朶酒店（朋友推薦，機場附近）
    notes: 改東方航空直飛上海，比雙轉機省 4-5 小時。亞朶酒店是國內精品連鎖，PVG 機場 5 分鐘車程。

  - day: 2
    date: "2026-08-17"
    city_from: 上海
    city_to: 喀什
    transport: 東方航空 MU（PVG 07:05→KHG 13:50，6h45m 直飛）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 知有·疆南民宿 或 尋疆別苑民宿（喀什古城內）
    cover_place_id: kashgar
    highlights:
      - 早 05:00 起床，回浦東機場 check-in
      - 07:05 PVG 起飛
      - 13:50 抵喀什機場
      - 14:00 包車師傅接機 → 入住古城民宿
      - 15:00 喀什古城慢逛（維吾爾族傳統民居）
      - 16:30 艾提尕爾清真寺廣場曬太陽
      - 17:30 百年老茶館聽都塔爾/彈布林演奏
      - 19:00 騎士大觀園二樓晚餐（看一樓維吾爾婚禮）或古城街小吃
    notes: 東方航空 PVG-KHG 直飛是這航線最快的。13:50 抵達就能下午玩半天。住古城民宿沉浸體驗。

  - day: 3
    date: "2026-08-18"
    city_from: 喀什
    city_to: 喀什
    transport: 步行/包車市區
    altitude_m: 1289
    distance_km: 10
    drive_hours: 1
    overnight: 尋疆別苑民宿（喀什古城景區彩虹巷店）
    cover_place_id: id_kah_mosque
    highlights:
      - 早 08:00 公安局辦邊防證（含等待 2h）
      - 10:00 古城開城儀式（必看，提前排隊）
      - 11:00 香妃園遊覽（2h）
      - 13:00 午餐：烤鴿子、手抓飯、鴿子面
      - 16:00 香妃園十二木卡姆歌舞表演
      - 18:00 回酒店休息
      - 20:00 喀什古城夜市
    notes: 朋友推薦古城開城儀式（10am 限定）和十二木卡姆表演，超深度體驗。邊防證帶台胞證正本+住宿登記。

  - day: 4
    date: "2026-08-19"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 295
    drive_hours: 7
    overnight: 茗源民宿（托葛籣夏村，朋友推薦）
    cover_place_id: karakul_lake
    highlights:
      - 08:30 喀什酒店出發
      - 蓋孜檢查站（出示邊防證）
      - 白沙湖＋白沙山（停留拍照 30 分鐘）
      - 蘇巴什服務區午餐
      - 卡拉庫里湖（慕士塔格峰倒影，海拔 3600m）
      - 塔合曼濕地（雪山+草原+塔吉克民居）
      - 抵塔縣托葛籣夏村，入住茗源民宿
      - 觀看塔吉克民族婚禮（若當日有），跟著跳舞
    notes: 茗源民宿是朋友推薦的塔吉克族村民宿，能體驗在地文化。

  - day: 5
    date: "2026-08-20"
    city_from: 塔什庫爾干
    city_to: 塔什庫爾干
    transport: 包車市區/村莊
    altitude_m: 3100
    distance_km: 40
    drive_hours: 2
    overnight: 茗源民宿
    cover_place_id: jincaotan
    highlights:
      - 上午托葛籣夏村漫步，去牧民家裡做客
      - 中午縣城午餐
      - 觀看塔吉克鷹舞、塔吉克歌舞表演
      - 下午休息 3 小時（適應高原）
      - 傍晚石頭城＋金草灘日落
      - 晚上夜市看跳舞活動
    notes: 適應高度的一天，朋友建議下午多休息。鷹舞是塔吉克族非物質文化遺產。

  - day: 6
    date: "2026-08-21"
    city_from: 塔什庫爾干
    city_to: 大同鄉
    transport: 包車（314 國道塔瓦段 + 塔莎古道）
    altitude_m: 3500
    distance_km: 280
    drive_hours: 7
    overnight: 君宜牧家樂（大同鄉，朋友推薦）
    cover_place_id: panlong
    highlights:
      - 早 7:00 塔縣出發
      - 盤龍古道（639 個 S 形彎道，2019 通車）
      - 經瓦恰鄉午餐
      - 塔莎古道（朋友推薦，少人但景色壯觀）
      - 傍晚抵大同鄉
      - 入住君宜牧家樂（塔吉克族牧民家庭式體驗）
    notes: 盤龍古道+塔莎古道一日打包後直接住大同鄉，不回塔縣。明天從大同鄉繼續往莎車。

  - day: 7
    date: "2026-08-22"
    city_from: 大同鄉
    city_to: 莎車
    transport: 包車（塔莎古道下段）
    altitude_m: 1300
    distance_km: 180
    drive_hours: 6
    overnight: 蘭歐飯店（莎車縣政務中心火車站店，朋友推薦）
    cover_place_id: shache_palace
    highlights:
      - 早 8:00 大同鄉出發
      - 下高原（塔莎古道下段）
      - 中午抵莎車縣
      - 葉爾羌汗王宮（朋友推薦）
      - 阿曼尼莎汗王陵（認識十二木卡姆藝術歷史）
      - 紀念這位偉大的維吾爾女性藝術家
      - 晚上住莎車蘭歐飯店
    notes: 跳過葉城。莎車是葉爾羌汗國（15-16 世紀）首都，文化深度比葉城高。

  - day: 8
    date: "2026-08-23"
    city_from: 莎車
    city_to: 和田
    transport: 包車（315 國道，崑崙山北麓）
    altitude_m: 1380
    distance_km: 350
    drive_hours: 5
    overnight: 維也納國際飯店（和田夜市甌越公館店）或錦江都城（和田夜市團結廣場店）
    cover_place_id: yulong_river
    highlights:
      - 早 9:00 莎車出發（路程較短可悠閒）
      - 沿崑崙山北麓行駛
      - 中午抵和田吃飯
      - 下午玉龍喀什河體驗撿和田玉
      - 和田博物館
      - 晚上和田夜市（酒店步行 5 分鐘可達）
    notes: 莎車到和田路程比葉城到和田短一點，下午有更多時間玩和田。

  - day: 9
    date: "2026-08-24"
    city_from: 和田
    city_to: 阿拉爾
    transport: 包車（G580 沙漠公路，560km）
    altitude_m: 1000
    distance_km: 560
    drive_hours: 8
    overnight: 阿拉爾萬達美華飯店（塔里木大學店）
    cover_place_id: tarim_highway
    highlights:
      - 和田出發走 G580 沙漠公路（朋友推薦，比 G217 更深入沙漠）
      - 邊行邊拍：胡楊林、沙丘、戈壁
      - 晚上抵阿拉爾，住萬達美華
    notes: 朋友建議「今天坐車當休息」。G580 是新建沙漠公路，車況好但加油站少，師傅要提前準備。

  - day: 10
    date: "2026-08-25"
    city_from: 阿拉爾
    city_to: 庫車
    transport: 包車（連霍高速 + 大峽谷）
    altitude_m: 1500
    distance_km: 300
    drive_hours: 7
    overnight: 蘭歐·尚品飯店（庫車市太古裡夜市店，朋友推薦）
    cover_place_id: kuqa_canyon
    highlights:
      - 阿拉爾→庫車（連霍高速 4h）
      - 中午抵庫車午餐
      - 下午開車進入天山神秘大峽谷（紅色丹霞地貌）
      - 峽谷步行 3.7km，下午光線最佳
      - 晚上庫車太古裡夜市
    notes: 砍掉克孜爾石窟（你說不去）。改去天山神秘大峽谷（朋友推薦，超震撼）。

  - day: 11
    date: "2026-08-26"
    city_from: 庫車
    city_to: 巴音布魯克
    transport: 包車（獨庫公路南段）
    altitude_m: 2400
    distance_km: 350
    drive_hours: 7
    overnight: 巴音布魯克氈房 或 天鵝湖賓館
    cover_place_id: bayanbulak
    highlights:
      - 獨庫公路 217 國道南段（最精華段）
      - 鐵力買提達坂（雪山公路）
      - 大龍池/小龍池（高山湖泊）
      - 巴音布魯克草原（天鵝湖）
      - 九曲十八彎日落（必看，預留 17:00 後抵達）
    notes: 獨庫公路 6-10 月通車。日落是巴音布魯克招牌。

  - day: 12
    date: "2026-08-27"
    city_from: 巴音布魯克
    city_to: 伊寧
    transport: 包車（獨庫中段 + G218 伊犁河谷）
    altitude_m: 663
    distance_km: 350
    drive_hours: 8
    overnight: 維也納飯店（伊寧喀贊其店，朋友推薦）
    cover_place_id: narati
    highlights:
      - 早上巴音布魯克→那拉提（獨庫中段 4h）
      - 那拉提空中草原（半日玩）
      - 跟牧民去放牛羊，聽他們講草原故事
      - 下午 16:00 出發伊寧（4h）
      - 晚上抵伊寧，入住喀贊其店
    notes: 那拉提半天玩完直接到伊寧，朋友推薦這條路線。

  - day: 13
    date: "2026-08-28"
    city_from: 伊寧
    city_to: 賽里木湖
    transport: 包車（G218 + G30）
    altitude_m: 2073
    distance_km: 220
    drive_hours: 5
    overnight: 賽湖天泉飯店（賽里木湖景區店，朋友推薦）
    cover_place_id: sayram_lake
    highlights:
      - 上午伊寧深度：坐「哈迪克」馬車穿梭老城巷子
      - 喀贊其民俗村（藍房子、馬車）
      - 六星街（俄羅斯/塔塔爾多民族風情）
      - 伊黎河大橋日落
      - 中午午餐：烤包子、手抓飯、霜淇淋
      - 下午出發賽里木湖
      - 黃昏抵達，環湖看日落
    notes: 伊寧六星街是朋友強推的隱藏景點，超出片。中午吃飽再走，下午到賽里木湖剛好日落時間。

  - day: 14
    date: "2026-08-29"
    city_from: 賽里木湖
    city_to: 烏魯木齊
    transport: 包車（G30 連霍高速 + 烏市市區）
    altitude_m: 800
    distance_km: 530
    drive_hours: 7
    overnight: 烏魯木齊機場附近酒店
    cover_place_id: guozigou
    highlights:
      - 早 06:30 賽里木湖日出
      - 環湖一圈拍照
      - 賽里木湖→果子溝大橋（最美高速公路橋）
      - 沿 G30 連霍高速→烏蘇→烏魯木齊（530km/7h）
      - 17:00 抵烏市
      - 烏魯木齊國際大巴扎（伴手禮採購）
      - 紅山公園看夜景
      - 晚上 transfer 機場附近酒店
    notes: Day 15 早 09:05 飛機，必須住烏市機場附近。果子溝大橋會經過，車上拍照（高速不能停）。

  - day: 15
    date: "2026-08-30"
    city_from: 烏魯木齊
    city_to: 台北
    transport: 飛機（URC 09:05→上海轉→TPE 17:40）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: urumqi_bazaar
    highlights:
      - 06:30 抵達烏魯木齊地窩堡機場 check-in
      - 09:05 起飛
      - 經上海轉機
      - 17:40 抵達桃園機場
    notes: 早班機。建議 Day 14 晚一定睡早，05:30 起床。
