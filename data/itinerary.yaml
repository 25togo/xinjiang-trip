trip:
  name: 2026 南疆 14 天深度遊
  start_date: "2026-08-14"
  end_date: "2026-08-27"
  travelers: 2
  route_type: 帕米爾盤龍古道＋塔莎古道＋塔克拉瑪干沙漠公路＋獨庫公路＋伊犁河谷＋賽里木湖（喀什進、伊寧出 開口票）
  vehicle: 包車（單日 RMB 1100-1300）
  flight_in: "東方航空 MU｜8/14 台北 15:30 → 上海 PVG 17:30（住浦東亞朶酒店）｜8/15 PVG 07:05 → KHG 13:50（直飛 6h45m）"
  flight_out: "8/26 MU6254 IEL 17:20→SHA 虹橋 T2 22:10（A320，4h50m）｜8/27 MU5097 SHA 虹橋 T1 14:15→TSA 松山 16:15（A330，2h）"

days:
  - day: 1
    date: "2026-08-14"
    city_from: 台北
    city_to: 上海
    transport: 東方航空 MU（TPE 15:30→PVG 17:30，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海浦東亞朶酒店
    cover_place_id: shanghai
    highlights:
      - 13:30 抵桃園機場 check-in
      - 15:30 起飛 → 17:30 抵上海浦東 T1
      - 入住浦東亞朶酒店（朋友推薦，機場附近）
    notes: 改東方航空直飛上海，比雙轉機省 4-5 小時。亞朶酒店是國內精品連鎖，PVG 機場 5 分鐘車程。

  - day: 2
    date: "2026-08-15"
    city_from: 上海
    city_to: 喀什
    transport: 東方航空 MU（PVG 07:05→KHG 13:50，6h45m 直飛）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 知有·疆南民宿 或 尋疆別苑民宿（喀什古城內）
    cover_place_id: kashgar
    highlights:
      - 早 05:00 起床，回浦東機場 check-in
      - 07:05 PVG 起飛
      - 13:50 抵喀什機場
      - 14:00 包車師傅接機 → 入住古城民宿
      - 15:00 喀什古城慢逛（維吾爾族傳統民居）
      - 16:30 艾提尕爾清真寺廣場曬太陽
      - 17:30 百年老茶館聽都塔爾/彈布林演奏
      - 19:00 古城夜市吃晚餐
    notes: 明天一早要辦邊防證，建議晚上不要玩太晚，早點休息。

  - day: 3
    date: "2026-08-16"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 295
    drive_hours: 7
    overnight: 茗源民宿（托葛籣夏村，朋友推薦）
    cover_place_id: karakul_lake
    highlights:
      - 早 08:00 喀什公安局辦邊防證（含等待約 2h，帶台胞證正本+住宿登記）
      - 10:30 出發（314 國道帕米爾段）
      - 蓋孜檢查站（出示邊防證）
      - 白沙湖＋白沙山（停留拍照 30 分鐘）
      - 蘇巴什服務區午餐
      - 卡拉庫里湖（慕士塔格峰倒影，海拔 3600m）
      - 塔合曼濕地（雪山+草原+塔吉克民居）
      - 傍晚抵塔什庫爾干，入住茗源民宿
    notes: 邊防證當天辦，辦完再出發。比舊版少一天高度適應，抵達後多喝水、不劇烈運動，有高反症狀立即告知司機。

  - day: 4
    date: "2026-08-17"
    city_from: 塔什庫爾干
    city_to: 大同鄉
    transport: 包車（314 國道塔瓦段 + 塔莎古道）
    altitude_m: 3500
    distance_km: 280
    drive_hours: 7
    overnight: 君宜牧家樂（大同鄉，朋友推薦）
    cover_place_id: panlong
    highlights:
      - 早 7:00 塔縣出發
      - 盤龍古道（639 個 S 形彎道，2019 通車）
      - 經瓦恰鄉午餐
      - 塔莎古道（朋友推薦，少人但景色壯觀）
      - 傍晚抵大同鄉
      - 入住君宜牧家樂（塔吉克族牧民家庭式體驗）
    notes: 盤龍古道+塔莎古道一日打包，直接住大同鄉。明天往東到莎車。

  - day: 5
    date: "2026-08-18"
    city_from: 大同鄉
    city_to: 莎車
    transport: 包車（山路東行至葉城，接 G315）
    altitude_m: 1290
    distance_km: 200
    drive_hours: 5
    overnight: 莎車市區飯店（葉爾羌賓館或同檔次）
    cover_place_id: shache
    highlights:
      - 早 08:00 大同鄉出發，山路往東走
      - 途經葉城
      - 下午抵莎車（葉爾羌汗國古都）
      - 莎車老城慢逛（維吾爾族古建築街巷）
      - 阿勒屯清真寺（葉爾羌汗國時期建築）
      - 晚上莎車夜市
    notes: 從大同鄉往東走山路到葉城，接主幹道到莎車，下午抵達，輕鬆遊覽。

  - day: 6
    date: "2026-08-19"
    city_from: 莎車
    city_to: 和田
    transport: 包車（G315 南疆公路）
    altitude_m: 1373
    distance_km: 350
    drive_hours: 5
    overnight: 維也納國際飯店（和田夜市甌越公館店）或 錦江都城（夜市團結廣場店）
    cover_place_id: hotan
    highlights:
      - 早 09:00 出發
      - G315 東行沿沙漠南緣
      - 途經皮山縣
      - 下午抵和田
      - 玉龍喀什河撿玉點（看當地人淘玉，不用期待撿到）
      - 和田夜市（烤包子、馕坑肉、乾果海）
    notes: 莎車→和田全程高速輕鬆，下午早到，有半天逛和田。

  - day: 7
    date: "2026-08-20"
    city_from: 和田
    city_to: 阿拉爾
    transport: 包車（G580 塔克拉瑪干沙漠公路）
    altitude_m: 1012
    distance_km: 510
    drive_hours: 7
    overnight: 阿拉爾市區飯店
    cover_place_id: alaer
    highlights:
      - 早 08:00 出發
      - G580 塔克拉瑪干沙漠公路（世界最長沙漠公路，522km 直穿沙漠）
      - 沿途兩側防護林＋沙丘景觀
      - 沙漠公路服務站補給休息
      - 傍晚抵阿拉爾
    notes: G580 是全球最長的沙漠公路，直線穿越塔克拉瑪干，景觀孤絕壯烈。帶好零食飲水。

  - day: 8
    date: "2026-08-21"
    city_from: 阿拉爾
    city_to: 庫車
    transport: 包車（G0612 阿克蘇方向）
    altitude_m: 1500
    distance_km: 200
    drive_hours: 3
    overnight: 蘭歐·尚品飯店（庫車市太古裡夜市店，朋友推薦）
    cover_place_id: kuqa
    highlights:
      - 早 09:00 出發（今天輕鬆）
      - 中午前抵庫車
      - 午餐庫車拌麵（揪片子）
      - 下午天山神秘大峽谷（明早可再去，或下午先踩點）
      - 晚上庫車太古裡夜市
    notes: 今天只開 3h，下午大半天可休息或提前遊覽。

  - day: 9
    date: "2026-08-22"
    city_from: 庫車
    city_to: 天山石林
    transport: 包車（G217 獨庫公路南段）
    altitude_m: 2800
    distance_km: 150
    drive_hours: 4
    overnight: 天山石林景區民宿/帳篷營地
    cover_place_id: tianshan_shilin
    highlights:
      - 早 06:30 天山神秘大峽谷（丹霞地貌，峽谷步行 3.7km，光線最佳）
      - 09:30 出發走獨庫公路 G217 南段
      - 鐵力買提達坂（海拔 3817m，360° 天山雪山視野）
      - 下午抵天山石林（獨特石灰岩岩柱地貌）
      - 紮營或住民宿，傍晚看石林光影
    notes: 峽谷 06:30 早進早出，09:30 收工接獨庫公路南段。天山石林是G217沿線景觀重點，先確認當地住宿是否需要預訂。

  - day: 10
    date: "2026-08-23"
    city_from: 天山石林
    city_to: 那拉提
    transport: 包車（G217 獨庫公路北段）
    altitude_m: 1800
    distance_km: 290
    drive_hours: 6
    overnight: 那拉提哈薩克氈房 或 那拉提山莊
    cover_place_id: narati
    highlights:
      - 早起再看一次石林晨光
      - 09:00 出發走獨庫公路北段
      - 大龍池/小龍池（高山湖泊，倒映雪山）
      - 巴音布魯克九曲十八彎觀景台（路過停拍，不住）
      - 喬爾瑪烈士陵園
      - 下午抵那拉提空中草原
      - 跟著哈薩克牧民放牛羊，晚上氈房住宿
    notes: 獨庫公路北段精華，今天是風景最集中的一天。

  - day: 11
    date: "2026-08-24"
    city_from: 那拉提
    city_to: 伊寧
    transport: 包車（新源→伊寧）
    altitude_m: 662
    distance_km: 180
    drive_hours: 3
    overnight: 伊寧市區飯店（六星街附近）
    cover_place_id: yining
    highlights:
      - 上午那拉提空中草原最後遊覽
      - 中午出發
      - 下午抵伊寧
      - 六星街（民國時期俄羅斯風格建築街區，拍照聖地）
      - 伊寧夜市（薰衣草霜淇淋、烤包子、手抓飯）
    notes: 那拉提→伊寧只需 3h，下午早到，有大半天逛伊寧。六星街是伊犁最上鏡的地方。

  - day: 12
    date: "2026-08-25"
    city_from: 伊寧
    city_to: 伊寧
    transport: 包車（伊寧→賽里木湖→伊寧，當日來回）
    altitude_m: 662
    distance_km: 260
    drive_hours: 4
    overnight: 伊寧市區飯店（六星街附近）
    cover_place_id: sayram_lake
    highlights:
      - 早 08:00 出發前往賽里木湖（130km，2h）
      - 賽里木湖環湖遊覽（高山湖泊，碧藍如寶石）
      - 果子溝大橋（停車拍照）
      - 午餐湖邊
      - 下午 14:00 返回伊寧（2h）
      - 回伊寧繼續逛六星街或喀贊其民俗村
    notes: 賽里木湖當日來回，不住湖邊。果子溝大橋是連霍高速最美路段，來回都會經過。

  - day: 13
    date: "2026-08-26"
    city_from: 伊寧
    city_to: 上海
    transport: 東方航空 MU6254（IEL 17:20→SHA 虹橋 T2 22:10，4h50m）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海虹橋附近飯店（浦西/閔行，離 T1 20 分鐘內）
    cover_place_id: yining
    highlights:
      - 上午伊寧自由活動（喀贊其民俗村 或 六星街補拍）
      - 13:00 前往伊寧機場 check-in（建議提前 2.5h）
      - 17:20 MU6254 起飛
      - 22:10 抵上海虹橋 T2，提領行李
      - 入住虹橋附近飯店（明天 T1 出發，同棟建築不同端）
    notes: 落地虹橋 T2 後需提領行李、隔天重新託運到 T1。T1/T2 步行約 10-15 分鐘。

  - day: 14
    date: "2026-08-27"
    city_from: 上海
    city_to: 台北
    transport: 東方航空 MU5097（SHA 虹橋 T1 14:15→TSA 松山 16:15，A330，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: shanghai
    highlights:
      - 早上上海虹橋附近自由活動或輕鬆早餐
      - 11:30 前往虹橋 T1 check-in（建議提前 2.5h）
      - 14:15 MU5097 起飛（A330 寬體機）
      - 16:15 抵台北松山機場
      - 回家！
    notes: 全程東方航空，行李可直接托運到松山（確認時再問地勤能否 through check-in）。
