trip:
  name: 2026 南疆 15 天深度遊
  start_date: "2026-08-16"
  end_date: "2026-08-30"
  travelers: 2
  route_type: 帕米爾盤龍古道＋塔莎古道＋獨庫南中段＋伊犁河谷六星街＋賽里木湖＋果子溝（喀什進、烏魯木齊出 開口票）
  vehicle: 包車（單日 RMB 1100-1300）
  flight_in: "東方航空 MU｜8/16 台北 15:30 → 上海 PVG 17:30（住浦東亞朶酒店）｜8/17 PVG 07:05 → KHG 13:50（直飛 6h45m）"
  flight_out: "8/30 烏魯木齊 09:05 → 上海轉機 → 台北 17:40"

days:
  - day: 1
    date: "2026-08-16"
    city_from: 台北
    city_to: 上海
    transport: 東方航空 MU（TPE 15:30→PVG 17:30，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海浦東亞朶酒店
    cover_place_id: shanghai
    highlights:
      - 13:30 抵桃園機場 check-in
      - 15:30 起飛 → 17:30 抵上海浦東 T1
      - 入住浦東亞朶酒店（朋友推薦，機場附近）
    notes: 改東方航空直飛上海，比雙轉機省 4-5 小時。亞朶酒店是國內精品連鎖，PVG 機場 5 分鐘車程。

  - day: 2
    date: "2026-08-17"
    city_from: 上海
    city_to: 喀什
    transport: 東方航空 MU（PVG 07:05→KHG 13:50，6h45m 直飛）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 知有·疆南民宿 或 尋疆別苑民宿（喀什古城內）
    cover_place_id: kashgar
    highlights:
      - 早 05:00 起床，回浦東機場 check-in
      - 07:05 PVG 起飛
      - 13:50 抵喀什機場
      - 14:00 包車師傅接機 → 入住古城民宿
      - 15:00 喀什古城慢逛（維吾爾族傳統民居）
      - 16:30 艾提尕爾清真寺廣場曬太陽
      - 17:30 百年老茶館聽都塔爾/彈布林演奏
      - 19:00 騎士大觀園二樓晚餐（看一樓維吾爾婚禮）或古城街小吃
    notes: 東方航空 PVG-KHG 直飛是這航線最快的。13:50 抵達就能下午玩半天。住古城民宿沉浸體驗。

  - day: 3
    date: "2026-08-18"
    city_from: 喀什
    city_to: 喀什
    transport: 步行/包車市區
    altitude_m: 1289
    distance_km: 10
    drive_hours: 1
    overnight: 尋疆別苑民宿（喀什古城景區彩虹巷店）
    cover_place_id: id_kah_mosque
    highlights:
      - 早 08:00 公安局辦邊防證（含等待 2h）
      - 10:00 古城開城儀式（必看，提前排隊）
      - 11:00 香妃園遊覽（2h）
      - 13:00 午餐：烤鴿子、手抓飯、鴿子面
      - 16:00 香妃園十二木卡姆歌舞表演
      - 18:00 回酒店休息
      - 20:00 喀什古城夜市
    notes: 朋友推薦古城開城儀式（10am 限定）和十二木卡姆表演，超深度體驗。邊防證帶台胞證正本+住宿登記。

  - day: 4
    date: "2026-08-19"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 295
    drive_hours: 7
    overnight: 茗源民宿（托葛籣夏村，朋友推薦）
    cover_place_id: karakul_lake
    highlights:
      - 08:30 喀什酒店出發
      - 蓋孜檢查站（出示邊防證）
      - 白沙湖＋白沙山（停留拍照 30 分鐘）
      - 蘇巴什服務區午餐
      - 卡拉庫里湖（慕士塔格峰倒影，海拔 3600m）
      - 塔合曼濕地（雪山+草原+塔吉克民居）
      - 抵塔縣托葛籣夏村，入住茗源民宿
      - 觀看塔吉克民族婚禮（若當日有），跟著跳舞
    notes: 茗源民宿是朋友推薦的塔吉克族村民宿，能體驗在地文化。

  - day: 5
    date: "2026-08-20"
    city_from: 塔什庫爾干
    city_to: 塔什庫爾干
    transport: 包車市區/村莊
    altitude_m: 3100
    distance_km: 40
    drive_hours: 2
    overnight: 茗源民宿
    cover_place_id: jincaotan
    highlights:
      - 上午托葛籣夏村漫步，去牧民家裡做客
      - 中午縣城午餐
      - 觀看塔吉克鷹舞、塔吉克歌舞表演
      - 下午休息 3 小時（適應高原）
      - 傍晚石頭城＋金草灘日落
      - 晚上夜市看跳舞活動
    notes: 適應高度的一天，朋友建議下午多休息。鷹舞是塔吉克族非物質文化遺產。

  - day: 6
    date: "2026-08-21"
    city_from: 塔什庫爾干
    city_to: 大同鄉
    transport: 包車（314 國道塔瓦段 + 塔莎古道）
    altitude_m: 3500
    distance_km: 280
    drive_hours: 7
    overnight: 君宜牧家樂（大同鄉，朋友推薦）
    cover_place_id: panlong
    highlights:
      - 早 7:00 塔縣出發
      - 盤龍古道（639 個 S 形彎道，2019 通車）
      - 經瓦恰鄉午餐
      - 塔莎古道（朋友推薦，少人但景色壯觀）
      - 傍晚抵大同鄉
      - 入住君宜牧家樂（塔吉克族牧民家庭式體驗）
    notes: 盤龍古道+塔莎古道一日打包後直接住大同鄉，不回塔縣。明天從大同鄉繼續往莎車。

  - day: 7
    date: "2026-08-22"
    city_from: 大同鄉
    city_to: 莎車
    transport: 包車（全程 180 公里，6 小時）
    altitude_m: 1300
    distance_km: 180
    drive_hours: 6
    overnight: 蘭歐飯店（莎車縣政務中心火車站店）
    cover_place_id: shache_palace
    highlights:
      - 大同鄉出發莎車縣（180 公里，6 小時）
      - 遊覽莎車葉爾羌汗王宮
      - 阿曼尼莎汗王陵
      - 認識十二木卡姆藝術的歷史
      - 紀念這位偉大的維吾爾女性藝術家
      - 晚上住莎車
    notes: 莎車是葉爾羌汗國（15-16 世紀）首都，文化深度比葉城高。

  - day: 8
    date: "2026-08-23"
    city_from: 莎車
    city_to: 和田
    transport: 包車（315 國道，崑崙山北麓）
    altitude_m: 1380
    distance_km: 350
    drive_hours: 5
    overnight: 維也納國際飯店（和田夜市甌越公館店）或錦江都城（和田夜市團結廣場店）
    cover_place_id: hotan_night_market
    highlights:
      - 早 9:00 莎車出發（路程較短可悠閒）
      - 沿崑崙山北麓行駛
      - 中午抵和田吃飯
      - 下午和田博物館（西域古國文物）
      - 和田老城散步
      - 晚上和田夜市（酒店步行 5 分鐘可達）
    notes: 莎車到和田路程比葉城到和田短一點，下午有更多時間玩和田老城。

  - day: 9
    date: "2026-08-24"
    city_from: 和田
    city_to: 阿拉爾
    transport: 包車（G580 沙漠公路，560km）
    altitude_m: 1000
    distance_km: 560
    drive_hours: 8
    overnight: 阿拉爾萬達美華飯店（塔里木大學店）
    cover_place_id: tarim_highway
    highlights:
      - 和田出發走 G580 沙漠公路（朋友推薦，比 G217 更深入沙漠）
      - 邊行邊拍：胡楊林、沙丘、戈壁
      - 晚上抵阿拉爾，住萬達美華
    notes: 朋友建議「今天坐車當休息」。G580 是新建沙漠公路，車況好但加油站少，師傅要提前準備。

  - day: 10
    date: "2026-08-25"
    city_from: 阿拉爾
    city_to: 庫車
    transport: 包車（連霍高速 + 大峽谷）
    altitude_m: 1500
    distance_km: 300
    drive_hours: 7
    overnight: 蘭歐·尚品飯店（庫車市太古裡夜市店，朋友推薦）
    cover_place_id: kuqa_canyon
    highlights:
      - 阿拉爾→庫車（連霍高速 4h）
      - 中午抵庫車午餐
      - 下午開車進入天山神秘大峽谷（紅色丹霞地貌）
      - 峽谷步行 3.7km，下午光線最佳
      - 晚上庫車太古裡夜市
    notes: 天山神秘大峽谷是朋友強推的紅色丹霞地貌，下午光線最佳。

  - day: 11
    date: "2026-08-26"
    city_from: 庫車
    city_to: 那拉提
    transport: 包車（獨庫公路南段，一日衝）
    altitude_m: 1800
    distance_km: 450
    drive_hours: 10
    overnight: 那拉提哈薩克氈房 或 那拉提山莊
    cover_place_id: duku_highway
    highlights:
      - 早 6:00 庫車出發
      - 獨庫公路 217 國道南段（最精華段）
      - 鐵力買提達坂（雪山公路）
      - 大龍池/小龍池（高山湖泊）
      - 路過巴音布魯克（不停留，繼續往那拉提）
      - 晚 16:00 抵那拉提，入住氈房
    notes: 跳過巴音布魯克住宿（不看九曲日落），直衝那拉提。最累的一天，建議清晨 6 點出發。

  - day: 12
    date: "2026-08-27"
    city_from: 那拉提
    city_to: 夏塔
    transport: 包車（G218 + 昭蘇）
    altitude_m: 2000
    distance_km: 250
    drive_hours: 5
    overnight: 夏塔哈薩克族人氈房（朋友推薦）
    cover_place_id: xiata
    highlights:
      - 上午那拉提空中草原最後遊覽
      - 跟著哈薩克牧民放牛羊
      - 中午午餐後出發
      - 下午經昭蘇縣（紫色薰衣草季節 6-7 月）
      - 傍晚抵夏塔
      - 入住哈薩克氈房，喝馬奶聽冬不拉
    notes: 從那拉提經昭蘇到夏塔，是伊犁河谷南線。夏塔是「冰川下的草原」，朋友強推。

  - day: 13
    date: "2026-08-28"
    city_from: 夏塔
    city_to: 賽里木湖
    transport: 包車（夏塔徒步+伊昭公路+果子溝）
    altitude_m: 2073
    distance_km: 400
    drive_hours: 8
    overnight: 賽湖天泉飯店（賽里木湖景區店，朋友推薦）
    cover_place_id: xiata
    highlights:
      - 早 7:00 夏塔徒步或騎馬到雪山山腳（2-3h）
      - 11:00 出發夏塔→伊昭公路
      - 經霍城
      - 果子溝大橋（最美高速公路橋）
      - 17:00 抵賽里木湖
      - 黃昏環湖看日落
    notes: 夏塔徒步建議騎馬（朋友推薦），體力負擔小。Day 13 駕車 8h 重日，建議早睡明天才有體力。

  - day: 14
    date: "2026-08-29"
    city_from: 賽里木湖
    city_to: 烏魯木齊
    transport: 包車（G30 連霍高速 + 烏市市區）
    altitude_m: 800
    distance_km: 530
    drive_hours: 7
    overnight: 烏魯木齊機場附近酒店
    cover_place_id: guozigou
    highlights:
      - 早 06:30 賽里木湖日出
      - 環湖一圈拍照（1h）
      - 8:00 出發
      - 沿 G30 連霍高速→烏蘇→烏魯木齊
      - 17:00 抵烏市
      - 烏魯木齊國際大巴扎（伴手禮採購）
      - 紅山公園看夜景
      - 晚上 transfer 機場附近酒店
    notes: Day 15 早 09:05 飛機，必須住烏市機場附近。

  - day: 15
    date: "2026-08-30"
    city_from: 烏魯木齊
    city_to: 台北
    transport: 飛機（URC 09:05→上海轉→TPE 17:40）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: urumqi_bazaar
    highlights:
      - 06:30 抵達烏魯木齊地窩堡機場 check-in
      - 09:05 起飛
      - 經上海轉機
      - 17:40 抵達桃園機場
    notes: 早班機。建議 Day 14 晚一定睡早，05:30 起床。
