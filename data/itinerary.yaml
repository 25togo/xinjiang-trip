trip:
  name: 2026 南北疆壯遊 14 天
  start_date: "2026-08-14"
  end_date: "2026-08-27"
  travelers: 2
  route_type: 帕米爾盤龍古道＋塔莎古道＋塔克拉瑪干沙漠公路＋獨庫公路＋唐布拉百里畫廊＋孟克特古道＋伊犁河谷＋賽里木湖（喀什進、伊寧出 開口票）
  vehicle: 包車（王海濤師傅，兩輛坦克 300）
  flight_in: "東方航空 MU5098｜8/14 松山 17:15 → 上海虹橋 T1（約 2h）→ 地鐵市域機場線到浦東（¥26）｜8/15 MU PVG 07:05 → KHG 13:50（直飛 6h45m）"
  flight_out: "8/26 MU6254 IEL 17:20→SHA 虹橋 T2 22:10（A320，4h50m）｜8/27 MU5097 SHA 虹橋 T1 14:15→TSA 松山 16:15（A330，2h）"

days:
  - day: 1
    date: "2026-08-14"
    city_from: 台北
    city_to: 上海
    transport: 東方航空 MU5098（松山 17:15→上海虹橋 T1，約 2h）+ 地鐵市域機場線到浦東
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海大眾空港賓館（浦東機場附近，預辦登機）
    cover_place_id: shanghai
    highlights:
      - 15:00 松山機場國際線集合
      - 安檢後至松山機場唯一貴賓室候機
      - 17:15 MU5098 起飛
      - 抵上海虹橋 T1
      - 搭地鐵 10 號線 3 號出口，購市域機場線到浦東 1/2 航站（¥26/人）
      - 步行至上海大眾空港賓館 check-in，預辦明日登機手續
    notes: 住浦東附近是因為明天 07:05 從 PVG 起飛，離機場步行可達。地鐵市域機場線全程約 40 分鐘。

  - day: 2
    date: "2026-08-15"
    city_from: 上海
    city_to: 喀什
    transport: 東方航空 MU（PVG 07:05→KHG 13:50，6h45m 直飛）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 一千零一夜民宿（喀什古城店）
    cover_place_id: kashgar
    highlights:
      - 早 05:00 起床，前往浦東機場 check-in
      - 東方航空貴賓室早餐（牛肉麵、雪菜肉絲麵很棒，位於 9 號登機口附近電梯下 2 樓）
      - 07:05 PVG 起飛，機上有正餐和簡餐，酒水無限供應
      - 13:50 抵喀什機場
      - 14:20 王海濤師傅與古麗迎接（兩輛坦克 300）
      - 入住一千零一夜民宿，喀什古城內，放行李休息拍照約一小時
      - 15:00 喀什古城慢逛（5A 景區，維吾爾族傳統民居，色彩繽紛如童話）
      - 艾提尕爾清真寺廣場曬太陽，看當地人悠閒聊天
      - 百年老茶館：都塔爾、彈布林演奏，當地人跟著音樂輕輕跳舞
      - 晚餐：騎士大觀園二樓（俯看一樓婚宴跳舞），或古城街小吃
    notes: 新疆時差比台灣晚 2-3 小時（21:26 才日落），作息要向後調整。高臺民居、艾提尕爾廣場可步行到達。師傅簡介：王海濤（甘肅人，娶維族姑娘定居喀什）、古麗（海濤媳婦，維族美女，名字叫古麗波斯坦‧阿卜杜熱合曼）。

  - day: 3
    date: "2026-08-16"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 310
    drive_hours: 7
    overnight: 托葛籣夏村茗源民宿（托格伦夏村，朋友推薦）
    cover_place_id: karakul_lake
    highlights:
      - 早 08:00 喀什公安局辦邊防證（含等待約 2h，帶台胞證正本+住宿登記）
      - 10:30 出發（314 國道帕米爾段）
      - 蘇巴什服務區休息整補
      - 白沙湖：北岸「曲魯克能巴什」機位可下到湖邊拍大場景；南岸觀光區賞沙山倒影
      - 路邊好景野餐午餐
      - 卡拉庫里湖（海拔 3600m，慕士塔格峰倒影，黑湖）
      - 塔合曼濕地（雪山+草原+塔吉克民居）
      - 傍晚抵塔什庫爾干，入住茗源民宿
    notes: 邊防證當天辦，辦完再出發。比舊版少一天高度適應，抵達後多喝水、不劇烈運動，有高反症狀立即告知師傅。塔縣西漢時為西域蒲犁國，海拔 3100m。

  - day: 4
    date: "2026-08-17"
    city_from: 塔什庫爾干
    city_to: 大同鄉
    transport: 包車（314 國道塔瓦段 + 塔莎古道）
    altitude_m: 3500
    distance_km: 225
    drive_hours: 7
    overnight: 君宜牧家樂（大同鄉，朋友推薦）
    cover_place_id: panlong
    highlights:
      - 早 08:30 塔縣出發
      - 10:00 前抵盤龍古道入口（只有 36km 卻有 600+ 個彎道，含觀景台約 2 小時）
      - 出龍盤古道，經瓦洽鄉
      - 塔莎古道（玄奘東歸路，雪山峽谷村莊，班迪爾湖「最藍的湖」）
      - 行動糧午餐（路上找小餐廳或烤肉攤）
      - 傍晚六點前抵大同鄉
      - 入住君宜牧家樂，體驗純粹的塔吉克村落生活
    notes: 塔莎古道秋天有金色胡楊，8 月仍然壯麗。9 月才有杏花，現在可買杏花蜜。

  - day: 5
    date: "2026-08-18"
    city_from: 大同鄉
    city_to: 莎車
    transport: 包車（山路東行至葉城，接 G315）
    altitude_m: 1290
    distance_km: 180
    drive_hours: 6
    overnight: 蘭歐飯店（莎車縣政務中心火車站店）
    cover_place_id: shache
    highlights:
      - 早 09:00 大同鄉出發，路況差，6 小時
      - 下午三點抵莎車
      - 葉爾羌汗王宮（葉爾羌汗國遺址）
      - 阿曼尼莎汗王陵（偉大的維吾爾女性藝術家，十二木卡姆創始人）
      - 露天理髮館（加滿清真寺附近，極具風情，¥10-15/人）
      - 晚餐：玫客滿啦（卷餅 + 烤鴿子，見證沒有一隻鴿子能活著離開莎車）
    notes: 今晚和明晚都住市區飯店，感受維族夜生活。路況差預留緩衝時間。

  - day: 6
    date: "2026-08-19"
    city_from: 莎車
    city_to: 和田
    transport: 包車（G315 南疆公路）
    altitude_m: 1373
    distance_km: 330
    drive_hours: 5
    overnight: 錦江都城飯店（和田夜市團結廣場店）
    cover_place_id: hotan
    highlights:
      - 早上出發，G315 東行沿沙漠南緣
      - 玉龍喀什河撿玉體驗（看當地人淘玉，體驗為主）
      - 和田博物館（時間夠或天氣不好時遊覽）
      - 夜市晚餐（烤包子、馕坑肉、乾果海，距飯店 400m）
      - 約特干故城（10:00 開城儀式，24:00 結束）：古於闐文明復刻，工作人員扮古人，美食街 + 歌舞演藝 + 玉石街區，光影技術再現千年歷史
    notes: 和田古稱「於闐」，是古代絲路佛教王國。約特干故城 22:00 入場，午夜 12 點才結束，回飯店要有心理準備。飯店距團結廣場 300m，距老夜市 400m。

  - day: 7
    date: "2026-08-20"
    city_from: 和田
    city_to: 阿拉爾
    transport: 包車（G580 塔克拉瑪干沙漠公路）
    altitude_m: 1012
    distance_km: 560
    drive_hours: 7
    overnight: 阿拉爾萬達美華飯店（塔里木大學店，備有洗衣機）
    cover_place_id: alaer
    highlights:
      - 早餐後出發
      - G580 塔克拉瑪干沙漠公路（維語「進去出不來」，世界第二大流動沙漠）
      - 沿路防護林與滴灌綠帶，隔出一條穿越「死亡之海」的生命廊道
      - 午後光線斜照，沙丘紋理最清晰，最佳拍攝時刻
      - 沙漠公路服務站補給
      - 傍晚抵阿拉爾（因沙漠而生的綠洲城市）
    notes: 全程 560km 是行程最長一天。酒店有洗衣機，可以把一路沾染的風沙洗去。帶足零食、飲水、防曬。

  - day: 8
    date: "2026-08-21"
    city_from: 阿拉爾
    city_to: 庫車
    transport: 包車（胡楊秘境景觀公路 + G217/G314）
    altitude_m: 1500
    distance_km: 350
    drive_hours: 6
    overnight: 蘭歐·尚品飯店（庫車市太古裡夜市店）
    cover_place_id: kuqa
    highlights:
      - 早餐後出發
      - 胡楊秘境：139km 景觀公路，沿塔里木河南岸穿梭 470 萬畝野生胡楊林，星星湖、帕滿湖倒影，千年枯胡楊挺立蒼涼
      - 午後抵庫車（龜茲古國，絲路北道核心，玄奘曾在此講學）
      - 龜茲古城：夯土牆、陶片痕跡，殘垣間有絲路歷史感
      - 熱斯坦路老城：煙火氣，維族大叔茶館土炕、烤包子孜然香
      - 庫車王府（清代，朱紅門，中原牡丹纏西域葡萄的雕花）
      - 庫車大寺：綠色穹頂，老人誦經聲
      - 夜市採購，為明日翻越天山做準備
    notes: 350km 今天稍長，但胡楊秘境非常值得。明天要離開南疆，翻越天山進入北疆，獨庫公路之旅正式開始。

  - day: 9
    date: "2026-08-22"
    city_from: 庫車
    city_to: 天山石林
    transport: 包車（G217 獨庫公路南段）
    altitude_m: 2800
    distance_km: 200
    drive_hours: 5
    overnight: 蒙古族牧民氈房門得接待站（有餐飲提供）
    cover_place_id: tianshan_shilin
    highlights:
      - 早起前往天山神秘大峽谷（克孜利亞，維語「紅色山崖」）
      - 峽谷步行全程 3.7km，紅褐色砂岩高聳，光影變化豐富，谷口開闊、深處僅容一人側身
      - 獨庫公路 G217 南段北上
      - 大龍池 / 小龍池（高山湖泊，倒映雪山）
      - 鐵力買提達坂（海拔 3540m，一日四季）
      - 翻越達坂後左轉進入天山石林，非鋪裝盤山路約 3 小時
      - 入住門得接待站氈房，在星空與山風中停歇
    notes: 今天是「感受一日四季」的精華路段。天山石林左轉後路況較差，請師傅慢行。

  - day: 10
    date: "2026-08-23"
    city_from: 天山石林
    city_to: 那拉提
    transport: 包車（G217 獨庫公路北段）
    altitude_m: 1800
    distance_km: 290
    drive_hours: 6
    overnight: 那拉提哈薩克族氈房（空中草原）
    cover_place_id: narati
    highlights:
      - 上午徒步天山石林（高山草原 + 石灰岩石柱，雲影與風勢變化）
      - 午後下山，經巴音布魯克鎮短暫補給與休整
      - 獨庫公路北段繼續北行（沿途草原逐漸展開，河谷與山脈交錯）
      - 喬爾瑪烈士陵園（短暫停留）
      - 傍晚抵那拉提空中草原
      - 入住哈薩克族氈房，跟著牧民體驗牧場生活
    notes: 獨庫公路北段精華路段，今天風景最集中。那拉提氈房住宿請提前確認預訂。

  - day: 11
    date: "2026-08-24"
    city_from: 那拉提
    city_to: 伊寧
    transport: 包車（新源→伊寧，約 3h）
    altitude_m: 662
    distance_km: 150
    drive_hours: 3
    overnight: 維也納飯店（伊寧喀贊其店）
    cover_place_id: yining
    highlights:
      - 上午那拉提草原最後慢逛
      - 中午出發往伊寧
      - 下午抵伊寧
      - 六星街（俄羅斯風格建築，多民族融合）
      - 伊寧夜市（薰衣草霜淇淋、烤包子、手抓飯）
    notes: 那拉提→伊寧約 3h，下午早到，有大半天逛城。

  - day: 12
    date: "2026-08-25"
    city_from: 伊寧
    city_to: 賽里木湖
    transport: 包車（伊寧→賽里木湖，130km，約 3h）
    altitude_m: 2073
    distance_km: 130
    drive_hours: 3
    overnight: 阿肯的家·湖畔牧歌民宿（賽里木湖畔氈房）
    cover_place_id: sayram_lake
    highlights:
      - 上午伊寧喀贊其民俗區漫步，搭「哈迪克」馬車穿行巷弄
      - 馬車夫緩緩講述老城故事，藍色木屋彩色門窗延伸兩側
      - 午後沿伊犁河谷公路前往賽里木湖，海拔漸升，草原天際線展開
      - 抵賽里木湖（海拔 2073m，被譽為「凈海」）
      - 入住阿肯的家氈房，推門即見湖水
      - 哈薩克族主人阿肯可能以冬不拉琴聲迎接，奶茶 + 烤肉
      - 傍晚湖面夕陽柔光，草坡土撥鼠探頭活動
      - 夜晚星空清晰，湖岸與天際交融
    notes: 連住兩晚不能洗澡，請有心理準備。果子溝大橋在去程路上（連霍高速最美路段，停車拍照）。

  - day: 13
    date: "2026-08-26"
    city_from: 賽里木湖
    city_to: 上海
    transport: 包車賽里木湖→IEL 伊寧機場（130km，2h）+ 東方航空 MU6254（IEL 17:20→SHA 虹橋 T2 22:10，4h50m）
    altitude_m: 4
    distance_km: 130
    drive_hours: 2
    overnight: 上海虹橋附近飯店（浦西/閔行，離 T1 20 分鐘內）
    cover_place_id: yining
    highlights:
      - 清晨推開氈房門，賽里木湖晨光如鏡
      - 逆時針環遊賽里木湖一圈約 90km，不同觀景點感受湖面與雪山輪廓
      - 11:30 離湖，包車往伊寧機場（130km，約 2h）
      - 14:00 抵伊寧機場 check-in（MU6254 建議提前 2.5h）
      - 17:20 MU6254 起飛
      - 22:10 抵上海虹橋 T2，提領行李
      - 入住虹橋附近飯店
    notes: 11:30 離湖，14:00 到機場剛好。T2 落地後步行 10-15 分鐘到 T1，明天從 T1 飛台北。

  - day: 14
    date: "2026-08-27"
    city_from: 上海
    city_to: 台北
    transport: 東方航空 MU5097（SHA 虹橋 T1 14:15→TSA 松山 16:15，A330，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: shanghai
    highlights:
      - 早上上海虹橋附近自由活動或輕鬆早餐
      - 11:30 前往虹橋 T1 check-in（建議提前 2.5h）
      - 14:15 MU5097 起飛（A330 寬體機）
      - 16:15 抵台北松山機場
      - 回家！
    notes: 全程東方航空，行李可試著要求 through check-in 直掛松山（不保證，現場問地勤）。
