trip:
  name: 2026 南疆 14 天深度遊
  start_date: "2026-08-14"
  end_date: "2026-08-27"
  travelers: 2
  route_type: 帕米爾盤龍古道＋塔莎古道＋獨庫南中段＋伊犁河谷六星街＋賽里木湖＋果子溝（喀什進、烏魯木齊出 開口票）
  vehicle: 包車（單日 RMB 1100-1300）
  flight_in: "東方航空 MU｜8/14 台北 15:30 → 上海 PVG 17:30（住浦東亞朶酒店）｜8/15 PVG 07:05 → KHG 13:50（直飛 6h45m）"
  flight_out: "8/26 URC 20:20 MU8370（上海航空）→ PVG 01:15+1｜換機場（浦東→虹橋，提領行李重新託運）｜8/27 SHA 14:15 MU5097 → TSA 16:15"

days:
  - day: 1
    date: "2026-08-14"
    city_from: 台北
    city_to: 上海
    transport: 東方航空 MU（TPE 15:30→PVG 17:30，2h）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 上海浦東亞朶酒店
    cover_place_id: shanghai
    highlights:
      - 13:30 抵桃園機場 check-in
      - 15:30 起飛 → 17:30 抵上海浦東 T1
      - 入住浦東亞朶酒店（朋友推薦，機場附近）
    notes: 改東方航空直飛上海，比雙轉機省 4-5 小時。亞朶酒店是國內精品連鎖，PVG 機場 5 分鐘車程。

  - day: 2
    date: "2026-08-15"
    city_from: 上海
    city_to: 喀什
    transport: 東方航空 MU（PVG 07:05→KHG 13:50，6h45m 直飛）
    altitude_m: 1289
    distance_km: 0
    drive_hours: 0
    overnight: 知有·疆南民宿 或 尋疆別苑民宿（喀什古城內）
    cover_place_id: kashgar
    highlights:
      - 早 05:00 起床，回浦東機場 check-in
      - 07:05 PVG 起飛
      - 13:50 抵喀什機場
      - 14:00 包車師傅接機 → 入住古城民宿
      - 15:00 喀什古城慢逛（維吾爾族傳統民居）
      - 16:30 艾提尕爾清真寺廣場曬太陽
      - 17:30 百年老茶館聽都塔爾/彈布林演奏
      - 19:00 騎士大觀園二樓晚餐（看一樓維吾爾婚禮）或古城街小吃
    notes: 東方航空 PVG-KHG 直飛是這航線最快的。13:50 抵達就能下午玩半天。住古城民宿沉浸體驗。

  - day: 3
    date: "2026-08-16"
    city_from: 喀什
    city_to: 喀什
    transport: 步行/包車市區
    altitude_m: 1289
    distance_km: 10
    drive_hours: 1
    overnight: 尋疆別苑民宿（喀什古城景區彩虹巷店）
    cover_place_id: id_kah_mosque
    highlights:
      - 早 08:00 公安局辦邊防證（含等待 2h）
      - 10:00 古城開城儀式（必看，提前排隊）
      - 11:00 香妃園遊覽（2h）
      - 13:00 午餐：烤鴿子、手抓飯、鴿子面
      - 16:00 香妃園十二木卡姆歌舞表演
      - 18:00 回酒店休息
      - 20:00 喀什古城夜市
    notes: 朋友推薦古城開城儀式（10am 限定）和十二木卡姆表演，超深度體驗。邊防證帶台胞證正本+住宿登記。

  - day: 4
    date: "2026-08-17"
    city_from: 喀什
    city_to: 塔什庫爾干
    transport: 包車（314 國道帕米爾段）
    altitude_m: 3100
    distance_km: 295
    drive_hours: 7
    overnight: 茗源民宿（托葛籣夏村，朋友推薦）
    cover_place_id: karakul_lake
    highlights:
      - 08:30 喀什酒店出發
      - 蓋孜檢查站（出示邊防證）
      - 白沙湖＋白沙山（停留拍照 30 分鐘）
      - 蘇巴什服務區午餐
      - 卡拉庫里湖（慕士塔格峰倒影，海拔 3600m）
      - 塔合曼濕地（雪山+草原+塔吉克民居）
      - 抵塔縣托葛籣夏村，入住茗源民宿
      - 觀看塔吉克民族婚禮（若當日有），跟著跳舞
    notes: 茗源民宿是朋友推薦的塔吉克族村民宿，能體驗在地文化。

  - day: 5
    date: "2026-08-18"
    city_from: 塔什庫爾干
    city_to: 塔什庫爾干
    transport: 包車市區/村莊
    altitude_m: 3100
    distance_km: 40
    drive_hours: 2
    overnight: 茗源民宿
    cover_place_id: jincaotan
    highlights:
      - 上午托葛籣夏村漫步，去牧民家裡做客
      - 中午縣城午餐
      - 觀看塔吉克鷹舞、塔吉克歌舞表演
      - 下午休息 3 小時（適應高原）
      - 傍晚石頭城＋金草灘日落
      - 晚上夜市看跳舞活動
    notes: 適應高度的一天，朋友建議下午多休息。鷹舞是塔吉克族非物質文化遺產。

  - day: 6
    date: "2026-08-19"
    city_from: 塔什庫爾干
    city_to: 大同鄉
    transport: 包車（314 國道塔瓦段 + 塔莎古道）
    altitude_m: 3500
    distance_km: 280
    drive_hours: 7
    overnight: 君宜牧家樂（大同鄉，朋友推薦）
    cover_place_id: panlong
    highlights:
      - 早 7:00 塔縣出發
      - 盤龍古道（639 個 S 形彎道，2019 通車）
      - 經瓦恰鄉午餐
      - 塔莎古道（朋友推薦，少人但景色壯觀）
      - 傍晚抵大同鄉
      - 入住君宜牧家樂（塔吉克族牧民家庭式體驗）
    notes: 盤龍古道+塔莎古道一日打包後直接住大同鄉，不回塔縣。明天從大同鄉往東到和田。

  - day: 7
    date: "2026-08-20"
    city_from: 大同鄉
    city_to: 和田
    transport: 包車（葉城 G315 南疆公路）
    altitude_m: 1373
    distance_km: 450
    drive_hours: 8
    overnight: 維也納國際飯店（和田夜市甌越公館店）或 錦江都城（夜市團結廣場店）
    cover_place_id: hotan
    highlights:
      - 早 08:00 大同鄉出發往東走山路到葉城
      - 接 G315 南疆公路沿沙漠南緣東行
      - 路過莎車不住（如有時間可停 30 分鐘看老城）
      - 傍晚抵和田
      - 晚上和田夜市（烤包子、馕坑肉、和田玉市場）
    notes: 從大同鄉往東經葉城接主幹道，一路沿塔克拉瑪干南緣到和田，莎車路過不住。

  - day: 8
    date: "2026-08-21"
    city_from: 和田
    city_to: 庫車
    transport: 包車（G580 塔克拉瑪干沙漠公路）
    altitude_m: 1500
    distance_km: 540
    drive_hours: 7
    overnight: 蘭歐·尚品飯店（庫車市太古裡夜市店，朋友推薦）
    cover_place_id: kuqa
    highlights:
      - 早 08:00 和田出發
      - 走 G580 塔克拉瑪干沙漠公路（522km 穿越沙漠，兩側是胡楊林與沙丘）
      - 沙漠公路服務站補給
      - 下午抵輪台，轉入庫車
      - 晚上庫車太古裡夜市（龜茲風格建築）
    notes: G580 沙漠公路是全球最長的沙漠公路，視覺衝擊強。直線穿越塔克拉瑪干，比繞外圍快 3-4h。

  - day: 9
    date: "2026-08-22"
    city_from: 庫車
    city_to: 巴音布魯克
    transport: 包車（天山神秘大峽谷 + G217 獨庫公路南段）
    altitude_m: 2500
    distance_km: 240
    drive_hours: 6
    overnight: 巴音布魯克草原氈房 或 巴音布魯克鎮民宿
    cover_place_id: duku_highway
    highlights:
      - 早 06:30 進天山神秘大峽谷（紅色丹霞地貌，峽谷步行 3.7km）
      - 09:30 出峽谷出發走獨庫公路 G217 南段
      - 鐵力買提達坂（海拔 3817m，360° 天山雪山視野）
      - 大龍池/小龍池（高山湖泊，倒映雪山）
      - 下午抵巴音布魯克草原
      - 九曲十八彎觀景台（開都河蜿蜒草原，夕陽光線最佳）
      - 入住氈房，哈薩克牧民家訪
    notes: 峽谷早進早出，09:30 接獨庫南段，下午 4 點抵巴音布魯克，剛好趕上夕陽。

  - day: 10
    date: "2026-08-23"
    city_from: 巴音布魯克
    city_to: 那拉提
    transport: 包車（G217 獨庫公路北段）
    altitude_m: 1800
    distance_km: 200
    drive_hours: 4
    overnight: 那拉提哈薩克氈房 或 那拉提山莊
    cover_place_id: narati
    highlights:
      - 早起巴音布魯克天鵝湖（候鳥保護區，晨霧中看天鵝）
      - 09:00 出發走獨庫公路北段
      - 喬爾瑪烈士陵園（修路犧牲的解放軍紀念碑）
      - 下午抵那拉提空中草原
      - 跟著哈薩克牧民放牛羊，晚上氈房住宿
    notes: 只需 4h，下午完全是休閒時間，是全程最輕鬆的一天。

  - day: 11
    date: "2026-08-24"
    city_from: 那拉提
    city_to: 賽里木湖
    transport: 包車（新源→伊寧→果子溝→賽里木湖）
    altitude_m: 2073
    distance_km: 300
    drive_hours: 4
    overnight: 賽湖天泉飯店（賽里木湖景區店，朋友推薦）
    cover_place_id: sayram_lake
    highlights:
      - 上午那拉提空中草原最後遊覽
      - 中午出發
      - 路過伊寧可停六星街吃午餐（俄羅斯風格建築街區）
      - 果子溝大橋（停車拍照）
      - 下午抵賽里木湖
      - 黃昏環湖看日落
      - 住賽里木湖湖邊飯店
    notes: 那拉提→賽里木湖只需 4h，沿途可順遊伊寧六星街午餐。今晚住湖邊，明天看日出。

  - day: 12
    date: "2026-08-25"
    city_from: 賽里木湖
    city_to: 烏魯木齊
    transport: 包車（G30 連霍高速）
    altitude_m: 4
    distance_km: 530
    drive_hours: 7
    overnight: 烏魯木齊市區飯店（大巴扎附近）
    cover_place_id: guozigou
    highlights:
      - 06:30 賽里木湖日出（環湖一圈拍照）
      - 08:00 出發烏魯木齊（G30 連霍高速，530km）
      - 15:00 抵烏魯木齊
      - 烏魯木齊國際大巴扎逛逛（葡萄乾、巴旦木、絲巾）
      - 入住大巴扎附近飯店
      - 晚上夜市收尾
    notes: 提早一天到烏魯木齊，不趕班機，晚上可以好好逛。明天整天市區活動後再去機場。

  - day: 13
    date: "2026-08-26"
    city_from: 烏魯木齊
    city_to: 上海
    transport: MU8370 夜班機
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 飛機上（MU8370 機上）
    cover_place_id: urumqi_bazaar
    highlights:
      - 上午新疆維吾爾自治區博物館（2h，鎮館之寶：彩棺美女）
      - 午餐大盤雞或烤全羊（最後一頓新疆菜）
      - 下午烏魯木齊國際大巴扎採購伴手禮（葡萄乾、巴旦木、絲巾）
      - 18:30 前往地窩堡機場 check-in
      - 20:20 MU8370（上海航空）URC 起飛 → 上海浦東 PVG 01:15+1
    notes: 整天在烏魯木齊，不趕時間。博物館是新疆文物最齊全的地方，值得花 2h。

  - day: 14
    date: "2026-08-27"
    city_from: 上海
    city_to: 台北
    transport: 飛機（MU5097 SHA→TSA）
    altitude_m: 4
    distance_km: 0
    drive_hours: 0
    overnight: 家
    cover_place_id: urumqi_bazaar
    highlights:
      - 01:15 抵上海浦東 PVG T1
      - 提領行李（需重新託運）
      - 換機場：浦東 PVG → 虹橋 SHA（計程車/地鐵約 1h，建議直接打車）
      - 13h 轉機時間充裕，可在虹橋附近休息或用餐
      - 14:15 SHA 虹橋 MU5097 起飛
      - 16:15 抵台北松山機場 TSA T1
    notes: 浦東→虹橋兩個機場相距 40km，計程車約 200 RMB/1h，是轉機最省力的方式。13h 空檔時間充足，不需緊張。
